<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Arial, sans-serif">
  <style>
    .node { fill: #f4f7fb; stroke: #2b4c7e; stroke-width: 2; }
    .title { font-size: 18px; font-weight: 700; fill: #1b2a41; }
    .label { font-size: 14px; fill: #1b2a41; }
    .line { stroke: #2b4c7e; stroke-width: 2; }
  </style>

  <!-- Root -->
  <rect class="node" x="620" y="40" width="360" height="50" rx="10" />
  <text class="title" x="800" y="70" text-anchor="middle">Drift-Aware MLOps Agent</text>

  <!-- Level 1 nodes -->
  <rect class="node" x="80" y="180" width="220" height="40" rx="8" />
  <text class="label" x="190" y="205" text-anchor="middle">Signals</text>

  <rect class="node" x="360" y="180" width="220" height="40" rx="8" />
  <text class="label" x="470" y="205" text-anchor="middle">Decisions</text>

  <rect class="node" x="640" y="180" width="220" height="40" rx="8" />
  <text class="label" x="750" y="205" text-anchor="middle">Monitoring</text>

  <rect class="node" x="920" y="180" width="220" height="40" rx="8" />
  <text class="label" x="1030" y="205" text-anchor="middle">Evidence Base</text>

  <rect class="node" x="1200" y="180" width="220" height="40" rx="8" />
  <text class="label" x="1310" y="205" text-anchor="middle">Evaluation</text>

  <!-- Lines from root to level 1 -->
  <line class="line" x1="800" y1="90" x2="190" y2="180" />
  <line class="line" x1="800" y1="90" x2="470" y2="180" />
  <line class="line" x1="800" y1="90" x2="750" y2="180" />
  <line class="line" x1="800" y1="90" x2="1030" y2="180" />
  <line class="line" x1="800" y1="90" x2="1310" y2="180" />

  <!-- Signals children -->
  <rect class="node" x="60" y="270" width="260" height="36" rx="6" />
  <text class="label" x="190" y="294" text-anchor="middle">Drift: covariate, concept, label delay</text>
  <rect class="node" x="60" y="320" width="260" height="36" rx="6" />
  <text class="label" x="190" y="344" text-anchor="middle">Performance: accuracy, F1, calibration</text>
  <rect class="node" x="60" y="370" width="260" height="36" rx="6" />
  <text class="label" x="190" y="394" text-anchor="middle">Fairness: DP/EO gaps, group drift</text>
  <rect class="node" x="60" y="420" width="260" height="36" rx="6" />
  <text class="label" x="190" y="444" text-anchor="middle">Cost/Energy: $ per retrain, kWh/CO2</text>
  <rect class="node" x="60" y="470" width="260" height="36" rx="6" />
  <text class="label" x="190" y="494" text-anchor="middle">Ops: latency SLOs, budget caps</text>

  <line class="line" x1="190" y1="220" x2="190" y2="270" />

  <!-- Decisions children -->
  <rect class="node" x="340" y="270" width="260" height="36" rx="6" />
  <text class="label" x="470" y="294" text-anchor="middle">Actions: retrain, fine-tune, defer</text>
  <rect class="node" x="340" y="320" width="260" height="36" rx="6" />
  <text class="label" x="470" y="344" text-anchor="middle">Triggers: thresholds + RL policy</text>
  <line class="line" x1="470" y1="220" x2="470" y2="270" />

  <!-- Monitoring children -->
  <rect class="node" x="620" y="270" width="260" height="36" rx="6" />
  <text class="label" x="750" y="294" text-anchor="middle">Stat tests: KS, PSI, MMD</text>
  <rect class="node" x="620" y="320" width="260" height="36" rx="6" />
  <text class="label" x="750" y="344" text-anchor="middle">Detectors: CDSeer + streaming</text>
  <rect class="node" x="620" y="370" width="260" height="36" rx="6" />
  <text class="label" x="750" y="394" text-anchor="middle">Dashboards: Prometheus, Grafana</text>
  <line class="line" x1="750" y1="220" x2="750" y2="270" />

  <!-- Evidence base children -->
  <rect class="node" x="900" y="270" width="260" height="36" rx="6" />
  <text class="label" x="1030" y="294" text-anchor="middle">Retrain timing: Regol 2025, Kasundra 2023</text>
  <rect class="node" x="900" y="320" width="260" height="36" rx="6" />
  <text class="label" x="1030" y="344" text-anchor="middle">Drift harm: Dong 2024, Pham 2025</text>
  <rect class="node" x="900" y="370" width="260" height="36" rx="6" />
  <text class="label" x="1030" y="394" text-anchor="middle">Fairness drift: Davis 2025, Deho 2024/25</text>
  <rect class="node" x="900" y="420" width="260" height="36" rx="6" />
  <text class="label" x="1030" y="444" text-anchor="middle">Federated fairness: Badar 2023, Salazar 2025/26</text>
  <line class="line" x1="1030" y1="220" x2="1030" y2="270" />

  <!-- Evaluation children -->
  <rect class="node" x="1180" y="270" width="260" height="36" rx="6" />
  <text class="label" x="1310" y="294" text-anchor="middle">Benchmarks: tabular, text, image</text>
  <rect class="node" x="1180" y="320" width="260" height="36" rx="6" />
  <text class="label" x="1310" y="344" text-anchor="middle">Metrics: accuracy, fairness, cost/energy, latency</text>
  <line class="line" x1="1310" y1="220" x2="1310" y2="270" />
</svg>
